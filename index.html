<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy 18th Birthday, M'lady</title>
  <meta name="description" content="An 18th birthday cake with a letter at the bottom." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@400;500;600&display=swap" />
  <style>
    :root {
      --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --font-sans: "Outfit", system-ui, sans-serif;
      --color-night: #0b0d19;
      --color-ink: #f7f1e6;
      --color-muted: #cbbfd8;
      --color-gold: #ffe6a7;
      --color-gold-deep: #e4c56a;
      --color-rose: #ff758f;
      --color-rose-deep: #c43b5c;
      --color-lilac: #c77dff;
      --color-mint: #72efdd;
      --color-paper: #fff8ee;
      --color-paper-ink: #3a2748;
      --color-frost: #fff5f7;
      --radius-card: 1.5rem;
    }
    * { box-sizing: border-box; }
    html {
      -webkit-font-smoothing: antialiased;
      background: var(--color-night);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      background: var(--color-night);
      color: var(--color-ink);
    }
    button:not(:disabled) { cursor: pointer; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .sky {
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: var(--color-night);
      background-image:
        radial-gradient(1.5px 1.5px at 12% 22%, rgba(255, 230, 167, 0.85) 50%, transparent 52%),
        radial-gradient(1px 1px at 22% 68%, rgba(255, 255, 255, 0.7) 50%, transparent 52%),
        radial-gradient(1.5px 1.5px at 78% 18%, rgba(255, 230, 167, 0.75) 50%, transparent 52%),
        radial-gradient(1px 1px at 88% 62%, rgba(199, 125, 255, 0.8) 50%, transparent 52%),
        radial-gradient(1px 1px at 64% 36%, rgba(255, 255, 255, 0.55) 50%, transparent 52%),
        radial-gradient(ellipse at 50% 110%, rgba(199, 125, 255, 0.16), transparent 52%),
        radial-gradient(ellipse at 10% 0%, rgba(255, 117, 143, 0.12), transparent 36%);
    }
    .sky::after {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.45);
    }
    .firefly {
      position: fixed;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-mint);
      box-shadow: 0 0 10px var(--color-mint), 0 0 18px var(--color-rose);
      pointer-events: none;
      z-index: 1;
      animation: drift 7s ease-in-out infinite alternate;
    }
    .firefly:nth-child(1) { left: 8%; top: 78%; }
    .firefly:nth-child(2) { left: 18%; top: 46%; animation-delay: -1.4s; animation-duration: 8.5s; }
    .firefly:nth-child(3) { left: 32%; top: 82%; animation-delay: -2.2s; }
    .firefly:nth-child(4) { left: 72%; top: 74%; animation-delay: -0.6s; animation-duration: 6.4s; }
    .firefly:nth-child(5) { left: 84%; top: 38%; animation-delay: -3s; }
    .firefly:nth-child(6) { left: 91%; top: 68%; animation-delay: -1.8s; animation-duration: 9s; }
    .firefly:nth-child(7) { left: 48%; top: 18%; animation-delay: -2.8s; width: 4px; height: 4px; }
    .firefly:nth-child(8) { left: 60%; top: 88%; animation-delay: -0.2s; }
    @keyframes drift {
      0% { transform: translate3d(0, 0, 0); opacity: 0.25; }
      50% { opacity: 0.95; }
      100% { transform: translate3d(28px, -26vh, 0); opacity: 0.2; }
    }
    .stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      width: min(64rem, 100%);
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3.5rem;
    }
    .banner { text-align: center; max-width: 40rem; }
    .eyebrow {
      margin: 0 0 0.6rem;
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--color-lilac);
      font-weight: 500;
    }
    .banner h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2.6rem, 7vw, 4.6rem);
      line-height: 0.95;
      color: var(--color-gold);
      text-wrap: balance;
      text-shadow: 0 0 18px rgba(255, 230, 167, 0.35), 0 0 32px rgba(255, 117, 143, 0.25);
    }
    .lede {
      margin: 0.9rem auto 0;
      max-width: 28rem;
      color: var(--color-muted);
      font-size: 1.05rem;
      line-height: 1.5;
      text-wrap: pretty;
    }
    .layout {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 2.75rem;
      width: 100%;
    }
    .portrait {
      position: relative;
      width: min(16.5rem, 100%);
      padding: 1.15rem 1.15rem 1rem;
      border-radius: var(--radius-card);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    .hat {
      position: absolute;
      top: -6px;
      left: 50%;
      z-index: 3;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 46px solid var(--color-rose);
      transform: translateX(-50%) rotate(8deg);
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35));
    }
    .hat-pom {
      position: absolute;
      top: -16px;
      left: -8px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--color-gold);
      box-shadow: 0 0 8px rgba(255, 230, 167, 0.8);
    }
    .hat-band {
      position: absolute;
      top: 16px;
      left: -18px;
      width: 36px;
      height: 7px;
      background: var(--color-gold-deep);
    }
    .gif-frame {
      overflow: hidden;
      border-radius: 0.9rem;
      box-shadow: 0 8px 22px rgba(255, 117, 143, 0.28);
      background: #120816;
      aspect-ratio: 0.94;
    }
    .gif-frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .portrait figcaption {
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      color: var(--color-muted);
    }
    .portrait figcaption a { color: var(--color-lilac); text-decoration: none; }
    .portrait figcaption a:hover { text-decoration: underline; }
    .still { display: flex; align-items: flex-end; justify-content: center; }
    .cake {
      position: relative;
      width: 15.5rem;
      height: 22rem;
      animation: floaty 4.8s ease-in-out infinite alternate;
    }
    @keyframes floaty {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
    .cake-glow {
      position: absolute;
      left: 50%;
      bottom: 9.5rem;
      width: 8rem;
      height: 5rem;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(255, 183, 3, 0.38), transparent 70%);
      filter: blur(6px);
      pointer-events: none;
    }
    .stand-foot {
      position: absolute; left: 50%; bottom: 0.2rem; width: 8.2rem; height: 1rem;
      transform: translateX(-50%); border-radius: 50%;
      background: radial-gradient(ellipse at center, #efe6f4 0%, #cbbad8 72%, #9d8aaf 100%);
    }
    .stand-stem {
      position: absolute; left: 50%; bottom: 0.7rem; width: 1.55rem; height: 2.1rem;
      transform: translateX(-50%); border-radius: 0.3rem;
      background: linear-gradient(90deg, #b7a6c8, #f7f1e8 48%, #a894ba);
    }
    .plate {
      position: absolute; left: 50%; bottom: 2.35rem; width: 13.4rem; height: 1.7rem;
      transform: translateX(-50%); border-radius: 50%; z-index: 2;
      background: radial-gradient(ellipse at center, #fff 0%, #f4e9f8 42%, #d9c8e6 100%);
      box-shadow: 0 14px 18px rgba(0, 0, 0, 0.28);
    }
    .tier { position: absolute; left: 50%; transform: translateX(-50%); z-index: 3; }
    .tier-base {
      bottom: 3.15rem; width: 11.4rem; height: 6.7rem;
      border-radius: 0.7rem 0.7rem 1rem 1rem;
      background: linear-gradient(180deg, #ffc2d4 0%, #ff8fab 42%, #e85d84 100%);
      box-shadow: inset 0 10px 14px rgba(255, 255, 255, 0.35), inset 0 -12px 16px rgba(120, 24, 52, 0.22);
    }
    .tier-top {
      bottom: 9.7rem; width: 7.5rem; height: 4.7rem;
      border-radius: 0.65rem 0.65rem 0.85rem 0.85rem;
      background: linear-gradient(180deg, #ffe0ea 0%, #ffb3c6 48%, #ff8fab 100%);
      box-shadow: inset 0 8px 12px rgba(255, 255, 255, 0.5), inset 0 -8px 12px rgba(180, 50, 80, 0.16);
    }
    .icing {
      position: absolute; left: -0.28rem; right: -0.28rem; top: -0.55rem; height: 1.35rem;
      border-radius: 1rem;
      background: linear-gradient(180deg, #fff 0%, var(--color-frost) 100%);
    }
    .icing-top { height: 1.15rem; top: -0.45rem; }
    .drip {
      position: absolute; top: 0.55rem; width: 0.72rem;
      border-radius: 0 0 0.7rem 0.7rem;
      background: linear-gradient(180deg, #fff, #ffe4ec);
    }
    .tier-base .d1 { left: 0.85rem; height: 1.35rem; }
    .tier-base .d2 { left: 2.7rem; height: 1.85rem; width: 0.85rem; }
    .tier-base .d3 { left: 5.1rem; height: 1.15rem; }
    .tier-base .d4 { left: 7.2rem; height: 1.7rem; }
    .tier-base .d5 { left: 9.3rem; height: 1.25rem; }
    .tier-top .d1 { left: 0.7rem; height: 1.15rem; }
    .tier-top .d2 { left: 2.35rem; height: 1.55rem; }
    .tier-top .d3 { left: 4.15rem; height: 1.05rem; }
    .tier-top .d4 { left: 5.7rem; height: 1.4rem; }
    .ribbon {
      position: absolute; left: 0; right: 0; top: 46%; height: 0.72rem;
      background: linear-gradient(180deg, #fff1c9, var(--color-gold-deep));
    }
    .pearl {
      position: absolute; top: 42%; width: 0.48rem; height: 0.48rem; border-radius: 50%; z-index: 4;
      background: radial-gradient(circle at 30% 30%, #fff, var(--color-gold) 62%, var(--color-gold-deep));
    }
    .tier-base .p1 { left: 1.15rem; }
    .tier-base .p2 { left: 3.2rem; }
    .tier-base .p3 { left: 7.15rem; }
    .tier-base .p4 { left: 9.15rem; }
    .sprinkle { position: absolute; width: 0.42rem; height: 0.16rem; border-radius: 1rem; z-index: 4; }
    .sprinkle.a { background: var(--color-gold); top: 2.2rem; left: 1.1rem; transform: rotate(28deg); }
    .sprinkle.b { background: var(--color-rose-deep); top: 2.8rem; right: 1rem; transform: rotate(-20deg); }
    .sprinkle.c { background: #fff; top: 1.9rem; right: 1.5rem; transform: rotate(50deg); }
    .sprinkle.d { background: var(--color-lilac); top: 3.1rem; left: 1.7rem; transform: rotate(-40deg); }
    .candles {
      position: absolute; left: 50%; bottom: 14.35rem; z-index: 5;
      display: flex; align-items: flex-end; justify-content: center; gap: 0.15rem;
      transform: translateX(-50%);
    }
    .numeral {
      position: relative; display: flex; align-items: flex-end; justify-content: center;
      width: 1.85rem; height: 2.7rem;
    }
    .digit {
      font-family: var(--font-display);
      font-size: 2.7rem;
      font-weight: 700;
      line-height: 0.8;
      color: #fff8ee;
      text-shadow: 0 2px 0 rgba(176, 96, 28, 0.45), 0 0 12px rgba(255, 230, 167, 0.55);
    }
    .flame {
      position: absolute; top: -0.95rem; left: 50%;
      width: 0.72rem; height: 1.05rem;
      transform: translateX(-50%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(circle at 50% 70%, #fff6c2, #ffb703 42%, #ff758f 78%);
      box-shadow: 0 0 12px #ffb703, 0 0 22px rgba(255, 117, 143, 0.75);
      animation: flicker 0.7s ease-in-out infinite alternate;
      transform-origin: center bottom;
    }
    .numeral:nth-child(2) .flame { animation-delay: -0.3s; }
    @keyframes flicker {
      from { transform: translateX(-50%) scale(0.92) rotate(-4deg); opacity: 0.85; }
      to { transform: translateX(-50%) scale(1.08) rotate(4deg); opacity: 1; }
    }
    .cake-letter {
      position: absolute; left: 50%; bottom: 3.45rem; z-index: 6;
      width: 4.15rem; padding: 0; border: 0; background: transparent; color: inherit; font: inherit;
      transform: translateX(-50%);
    }
    .cake-letter:hover, .cake-letter:focus-visible { transform: translateX(-50%) translateY(-4px); }
    .cake-letter:focus-visible {
      outline: 2px solid var(--color-gold);
      outline-offset: 4px;
      border-radius: 0.35rem;
    }
    .envelope-svg {
      display: block; width: 100%; height: auto; overflow: visible;
      filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.35));
    }
    .env-body { fill: #f4ecd4; stroke: #1a140e; stroke-width: 4.5; stroke-linejoin: round; }
    .env-fold { fill: none; stroke: #1a140e; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
    .env-petal { fill: #ff758f; stroke: #1a140e; stroke-width: 1.4; }
    .env-bloom { fill: #ffe6a7; stroke: #1a140e; stroke-width: 1.4; }
    .veil {
      display: none;
      position: fixed; inset: 0; z-index: 30;
      place-items: center; padding: 1.25rem;
      background: rgba(6, 7, 14, 0.72);
      backdrop-filter: blur(8px);
    }
    .veil.is-open { display: grid; animation: veil-in 200ms ease; }
    @keyframes veil-in { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      width: min(36rem, 100%);
      max-height: min(86vh, 40rem);
      overflow: auto;
      padding: 1.6rem 1.5rem 1.4rem;
      border-radius: 0.4rem 1rem 0.4rem 1rem;
      color: var(--color-paper-ink);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), transparent 5rem), var(--color-paper);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(196, 59, 92, 0.12);
      animation: sheet-in 340ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes sheet-in {
      from { opacity: 0; transform: translateY(18px) rotate(-1.2deg) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .sheet-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
    .monogram {
      display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 50%;
      border: 1px solid rgba(196, 59, 92, 0.35);
      font-family: var(--font-display); font-size: 1.6rem; color: var(--color-rose-deep);
    }
    .fold {
      display: inline-flex; align-items: center; gap: 0.35rem; min-height: 2.75rem;
      padding: 0.4rem 0.85rem; border: 1px solid rgba(58, 39, 72, 0.18); border-radius: 999px;
      background: transparent; color: var(--color-paper-ink); font: inherit; font-size: 0.85rem;
    }
    .fold:hover { background: rgba(58, 39, 72, 0.06); }
    .fold:focus-visible { outline: 2px solid var(--color-rose-deep); outline-offset: 3px; }
    .sheet h2 {
      margin: 1.15rem 0 0.35rem;
      font-family: var(--font-display); font-weight: 600;
      font-size: clamp(2rem, 5vw, 2.7rem); line-height: 1.05; text-wrap: balance;
    }
    .date-line {
      margin: 0 0 1.1rem; font-size: 0.82rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(58, 39, 72, 0.62);
    }
    .rule { height: 1px; margin-bottom: 1.1rem; background: linear-gradient(90deg, var(--color-gold-deep), transparent 80%); }
    .sheet p {
      margin: 0 0 0.95rem; font-family: var(--font-display);
      font-size: 1.28rem; line-height: 1.45; text-wrap: pretty;
    }
    .signoff { margin-top: 1.2rem; }
    .signoff p { margin: 0; }
    .signoff .name { margin-top: 0.15rem; font-style: italic; font-size: 1.45rem; color: var(--color-rose-deep); }
    @media (min-width: 860px) {
      .stage { padding-top: 3.25rem; }
      .sheet { padding: 2rem 2.4rem 1.8rem; }
    }
    @media (max-width: 420px) {
      .cake { width: 13.2rem; height: 19rem; transform-origin: bottom center; scale: 0.92; }
    }
    @media (prefers-reduced-motion: reduce) {
      .firefly, .cake, .flame, .veil, .sheet { animation: none; }
    }
  </style>
</head>
<body>
  <div class="sky">
    <div aria-hidden="true">
      <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>
      <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>
    </div>
    <main class="stage">
      <header class="banner">
        <p class="eyebrow">Her 18th</p>
        <h1>Happy 18th Birthday, M'lady!</h1>
        <p class="lede">The letter is at the bottom of the cake. Tap it when you want to read.</p>
      </header>
      <div class="layout">
        <figure class="portrait">
          <div class="hat" aria-hidden="true"><span class="hat-pom"></span><span class="hat-band"></span></div>
          <div class="gif-frame">
            <img src="https://media1.tenor.com/m/BQVULwR8-TYAAAAC/dance-chibi.gif" alt="Chibi Kaoruko dancing in a party mood" />
          </div>
          <figcaption>
            Dancing along ·
            <a href="https://tenor.com/view/dance-chibi-kaoruko-gif-361787905988688182" target="_blank" rel="noreferrer">Tenor</a>
          </figcaption>
        </figure>
        <div class="still">
          <div class="cake">
            <span class="sr-only">An 18th birthday cake. The candles are the numbers 1 and 8, and a letter sits at the bottom.</span>
            <div class="cake-glow" aria-hidden="true"></div>
            <div class="stand-foot" aria-hidden="true"></div>
            <div class="stand-stem" aria-hidden="true"></div>
            <div class="plate" aria-hidden="true"></div>
            <div class="tier tier-base" aria-hidden="true">
              <span class="icing"></span>
              <span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><span class="drip d4"></span><span class="drip d5"></span>
              <span class="ribbon"></span>
              <span class="pearl p1"></span><span class="pearl p2"></span><span class="pearl p3"></span><span class="pearl p4"></span>
            </div>
            <div class="tier tier-top" aria-hidden="true">
              <span class="icing icing-top"></span>
              <span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span><span class="drip d4"></span>
              <span class="sprinkle a"></span><span class="sprinkle b"></span><span class="sprinkle c"></span><span class="sprinkle d"></span>
            </div>
            <div class="candles" aria-hidden="true">
              <span class="numeral"><span class="flame"></span><span class="digit">1</span></span>
              <span class="numeral"><span class="flame"></span><span class="digit">8</span></span>
            </div>
            <button type="button" class="cake-letter" id="open-letter" aria-haspopup="dialog" aria-expanded="false" aria-label="Open the letter">
              <svg class="envelope-svg" viewBox="0 0 120 78" aria-hidden="true" focusable="false">
                <rect class="env-body" x="3.5" y="3.5" width="113" height="71" rx="5"></rect>
                <polyline class="env-fold" points="6,6 60,40 114,6"></polyline>
                <polyline class="env-fold" points="6,72 60,40 114,72"></polyline>
                <g transform="translate(60 40)">
                  <circle class="env-petal" cx="0" cy="-9" r="6.5"></circle>
                  <circle class="env-petal" cx="8.6" cy="-2.8" r="6.5"></circle>
                  <circle class="env-petal" cx="5.3" cy="7.3" r="6.5"></circle>
                  <circle class="env-petal" cx="-5.3" cy="7.3" r="6.5"></circle>
                  <circle class="env-petal" cx="-8.6" cy="-2.8" r="6.5"></circle>
                  <circle class="env-bloom" r="4.2"></circle>
                </g>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>
    <div class="veil" id="veil">
      <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="letter-title">
        <div class="sheet-top">
          <div class="monogram" aria-hidden="true">18</div>
          <button type="button" class="fold" id="close-letter">× Fold it closed</button>
        </div>
        <h2 id="letter-title"></h2>
        <p class="date-line" id="letter-occasion"></p>
        <div class="rule"></div>
        <div id="letter-body"></div>
        <div class="signoff">
          <p id="letter-closing"></p>
          <p class="name" id="letter-signature"></p>
        </div>
      </article>
    </div>
  </div>
  <script>
    // ============================================================
    //  EDIT THE LETTER HERE
    //  This is the only place the letter words live.
    //  Change the text, save, and refresh.
    // ============================================================
    var letter = {
      greeting: "My dearest M'lady,",
      occasion: "For your 18th birthday",
      paragraphs: [
        "Happy 18th birthday. I hope today feels as warm as candlelight, and as bright as the little lights that drifted in just to sit with you.",
        "You are the kind of person a real letter is for. Thank you for the way you laugh, the way you stay, and the way a room feels kinder the moment you are in it.",
        "Eighteen looks good on you. May this year open gently, may every wish you make over this cake find its way back to you, and may you always know how deeply you are loved."
      ],
      closing: "With all my heart,",
      signature: "The one who thinks you're The Best"
    };

    var openButton = document.getElementById("open-letter");
    var closeButton = document.getElementById("close-letter");
    var veil = document.getElementById("veil");
    var wasOpen = false;

    document.getElementById("letter-title").textContent = letter.greeting;
    document.getElementById("letter-occasion").textContent = letter.occasion;
    document.getElementById("letter-closing").textContent = letter.closing;
    document.getElementById("letter-signature").textContent = letter.signature;
    var body = document.getElementById("letter-body");
    letter.paragraphs.forEach(function (text) {
      var p = document.createElement("p");
      p.textContent = text;
      body.appendChild(p);
    });

    function openLetter() {
      veil.classList.add("is-open");
      openButton.setAttribute("aria-expanded", "true");
      wasOpen = true;
      closeButton.focus();
    }
    function closeLetter() {
      veil.classList.remove("is-open");
      openButton.setAttribute("aria-expanded", "false");
      if (wasOpen) openButton.focus();
    }

    openButton.addEventListener("click", openLetter);
    closeButton.addEventListener("click", closeLetter);
    veil.addEventListener("click", function (event) {
      if (event.target === veil) closeLetter();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && veil.classList.contains("is-open")) closeLetter();
    });
  </script>
</body>
</html>
