<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday, M'lady!</title>
  <style>
    :root {
      --bg-color: #0b0d19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent-pink: #ff758f;
      --accent-purple: #c77dff;
      --text-gold: #ffe6a7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Ambient Drifting Fireflies */
    .firefly {
      position: fixed;
      width: 5px;
      height: 5px;
      background: #72efdd;
      border-radius: 50%;
      box-shadow: 0 0 10px #72efdd, 0 0 20px #ff758f;
      pointer-events: none;
      animation: floatFirefly 7s ease-in-out infinite alternate;
    }

    @keyframes floatFirefly {
      0% { transform: translateY(0vh) translateX(0px); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-30vh) translateX(40px); opacity: 0.2; }
    }

    /* Header Styling */
    .title-banner {
      text-align: center;
      margin-bottom: 30px;
      z-index: 10;
    }

    .title-banner h1 {
      font-size: 2.8rem;
      color: var(--text-gold);
      text-shadow: 0 0 12px rgba(255, 230, 167, 0.6), 0 0 24px rgba(255, 117, 143, 0.4);
      letter-spacing: 2px;
    }

    .title-banner p {
      color: var(--accent-purple);
      font-size: 1.1rem;
      margin-top: 5px;
    }

    /* Main Container Layout */
    .main-stage {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 50px;
      max-width: 900px;
      width: 100%;
    }

    /* GIF Panel with Party Hat */
    .waguri-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 280px;
      z-index: 10;
    }

    .party-hat {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%) rotate(8deg);
      z-index: 10;
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 45px solid #ff0a54;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    .party-hat::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -8px;
      width: 16px;
      height: 16px;
      background: #ffd166;
      border-radius: 50%;
    }

    .gif-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(255, 117, 143, 0.3);
    }

    /* Bouquet Stage & Sway Animations */
    .bouquet-container {
      position: relative;
      width: 320px;
      height: 440px;
      display: flex;
      justify-content: center;
    }

    .flower-group {
      position: absolute;
      bottom: 60px;
      transform-origin: bottom center;
      animation: sway 4s ease-in-out infinite alternate;
    }

    .flower-group.rose-group { animation-delay: -1.5s; }
    .flower-group.sunflower-group { animation-delay: -3s; }

    @keyframes sway {
      0% { transform: rotate(-2.5deg); }
      100% { transform: rotate(2.5deg); }
    }

    /* Bioluminescent Stems */
    .stem {
      position: absolute;
      width: 6px;
      background: linear-gradient(to top, #0f4c5c, #52b788);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(82, 183, 136, 0.6);
    }
    .stem-hyacinth { height: 270px; bottom: 0; left: 50%; transform: translateX(-50%); }
    .stem-rose { height: 230px; bottom: 0; left: 50%; transform: translateX(-50%) rotate(-14deg); }
    .stem-sunflower { height: 230px; bottom: 0; left: 50%; transform: translateX(-50%) rotate(14deg); }

    /* --- 1. HYACINTH (GLOWING PURPLE) --- */
    .hyacinth-head {
      position: absolute;
      top: -400px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 170px;
      background: radial-gradient(circle at 50% 30%, rgba(224, 170, 255, 0.8), rgba(123, 44, 191, 0.4));
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 40px 40px 20px 20px;
      box-shadow: 0 0 25px rgba(199, 125, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.8);
    }

    /* --- 2. ROSE (GLOWING PINK) --- */
    .rose-head {
      position: absolute;
      top: -275px;
      left: -78px; /* Fixed alignment to match rotated stem */
      width: 95px;
      height: 95px;
    }

    .rose-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 25px;
      height: 25px;
      background: radial-gradient(circle, #ff0a54, #800f2f);
      border-radius: 50%;
      box-shadow: 0 0 12px #ff0a54;
      z-index: 3;
    }

    .r-petal {
      position: absolute;
      width: 45px;
      height: 60px;
      background: radial-gradient(circle at 50% 30%, rgba(255, 117, 143, 0.9), rgba(128, 15, 47, 0.6));
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50% 50% 50% 50% / 80% 80% 40% 40%;
      top: 50%;
      left: 50%;
      transform-origin: center bottom;
      box-shadow: 0 0 15px rgba(255, 117, 143, 0.7), inset 0 0 8px rgba(255, 255, 255, 0.7);
    }

    .r-petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
    .r-petal:nth-child(2) { transform: translate(-50%, -100%) rotate(72deg); }
    .r-petal:nth-child(3) { transform: translate(-50%, -100%) rotate(144deg); }
    .r-petal:nth-child(4) { transform: translate(-50%, -100%) rotate(216deg); }
    .r-petal:nth-child(5) { transform: translate(-50%, -100%) rotate(288deg); }

    /* --- 3. SUNFLOWER (GLOWING GOLD) --- */
    .sunflower-head {
      position: absolute;
      top: -20px;
      left: -48px; /* Fixed alignment to match rotated stem */
      width: 100px;
      height: 100px;
    }

    .sf-petal {
      position: absolute;
      width: 20px;
      height: 48px;
      background: radial-gradient(circle at 50% 20%, rgba(255, 209, 102, 0.95), rgba(255, 183, 3, 0.6));
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50% 50% 50% 50% / 90% 90% 30% 30%;
      top: -305px;
      left: 40px;
      transform-origin: bottom center;
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.7);
    }

    .sf-petal:nth-child(1) { transform: rotate(0deg) translateY(-22px); }
    .sf-petal:nth-child(2) { transform: rotate(45deg) translateY(-22px); }
    .sf-petal:nth-child(3) { transform: rotate(90deg) translateY(-22px); }
    .sf-petal:nth-child(4) { transform: rotate(135deg) translateY(-22px); }
    .sf-petal:nth-child(5) { transform: rotate(180deg) translateY(-22px); }
    .sf-petal:nth-child(6) { transform: rotate(225deg) translateY(-22px); }
    .sf-petal:nth-child(7) { transform: rotate(270deg) translateY(-22px); }
    .sf-petal:nth-child(8) { transform: rotate(315deg) translateY(-22px); }

    .sunflower-center {
      position: absolute;
      top: -275px;
      left: 33px;
      width: 34px;
      height: 34px;
      background: radial-gradient(circle, #582f0e, #3a1e05);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
      z-index: 3;
      border: 1px solid rgba(255, 209, 102, 0.5);
    }

    /* Translucent Frosted Wrapper */
    .wrapper-paper {
      position: absolute;
      bottom: 10px;
      width: 230px;
      height: 230px;
      background: linear-gradient(180deg, rgba(255, 200, 221, 0.25), rgba(123, 44, 191, 0.5));
      clip-path: polygon(0% 0%, 100% 0%, 70% 100%, 30% 100%);
      backdrop-filter: blur(6px);
      z-index: 5;
      border-top: 1px solid rgba(255, 255, 255, 0.4);
    }

    .love-card {
      position: absolute;
      bottom: 120px;
      right: 20px;
      width: 85px;
      height: 52px;
      background: #fff;
      color: #7b2cbf;
      font-size: 0.75rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transform: rotate(12deg);
      box-shadow: 0 0 15px rgba(199, 125, 255, 0.5);
      z-index: 7;
      text-align: center;
      padding: 4px;
    }
  </style>
</head>
<body>

    <!-- GIF Panel -->

</body>
</html>
